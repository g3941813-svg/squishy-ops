apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squishy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/g3941813-svg/squishy-ops.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
